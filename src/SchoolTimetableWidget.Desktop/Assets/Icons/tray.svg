<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- ADR 0031 small-size variant: 2x2 tiles stay legible at 16 px on light and dark taskbars. -->
  <rect width="16" height="16" rx="3.5" fill="#2F6766"/>
  <g fill="#F9F8F5"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/></g>
  <rect x="9" y="9" width="5" height="5" rx="1.2" fill="#F2B84B"/>
</svg>
