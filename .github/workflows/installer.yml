name: Windows installer

on:
  pull_request:
  push:
    branches: [main]
  # Two ways to release a version (ADR 0029):
  # - Run this workflow manually with release_version (e.g. 0.1.0). It builds the current
  #   ref and creates the v<version> tag and GitHub Release itself.
  # - Publish a GitHub Release in the UI; its tag builds and the installer is attached.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Create release v<version> from this ref (SemVer, e.g. 0.1.0). Leave empty for a CI build.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pack ID is also the install folder under %LOCALAPPDATA%, which Velopack deletes on
  # uninstall. It must never equal the profile folder "SchoolTimetableWidget" (ADR 0029).
  PACK_ID: SchoolTimetableWidgetNext
  VPK_VERSION: 1.2.161

jobs:
  package:
    name: Velopack installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if ($env:RELEASE_VERSION) { $v = $env:RELEASE_VERSION.Trim().TrimStart('v') }
          elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = "0.1.0-ci.$env:GITHUB_RUN_NUMBER" }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Not a SemVer version: $v" }
          "value=$v" >> $env:GITHUB_OUTPUT
      - name: Publish self-contained app
        run: >
          dotnet publish src/SchoolTimetableWidget.Desktop/SchoolTimetableWidget.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.value }} -o publish
      - name: Install vpk
        run: dotnet tool install --global vpk --version $env:VPK_VERSION
      - name: Pack installer
        run: >
          vpk pack --packId $env:PACK_ID --packVersion ${{ steps.version.outputs.value }}
          --packDir publish --mainExe SchoolTimetableWidget.Desktop.exe
          --packTitle "학교 시간표 위젯" --packAuthors chuthulhu --outputDir Releases
          --icon src/SchoolTimetableWidget.Desktop/Assets/Icons/app.ico
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ steps.version.outputs.value }}
          path: Releases/
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: Releases
          merge-multiple: true
      - name: Attach installer to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" Releases/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Create tag and release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.package.outputs.version }}
        run: >
          gh release create "$TAG" Releases/* --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA" --title "$TAG" --generate-notes
