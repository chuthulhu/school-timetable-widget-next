name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: SDK information
        run: dotnet --info
      - name: Restore
        run: dotnet restore SchoolTimetableWidget.sln
      - name: Build
        run: dotnet build SchoolTimetableWidget.sln --no-restore
      - name: Tests
        run: dotnet test SchoolTimetableWidget.sln --no-build --logger "console;verbosity=normal"
      - name: Bootstrap control-flow checks
        run: pwsh -NoProfile -File ./tests/bootstrap-dev.Tests.ps1
